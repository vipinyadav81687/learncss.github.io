<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS ::first-letter</title>

<style>
    body{
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    p{
        font-size: 18px;
        line-height: 26px;
    }

    /* first letter styling */
    p::first-letter{
        color: red;
        font-size: 40px;
        font-weight: bold;
        float: left;
        margin-right: 6px;
    }
</style>
</head>

<body>

<h1>CSS ::first-letter Example</h1>

<p>
    css first letter pseudo element paragraph ke pehle letter ko style
    karne ke kaam aata hai.
</p>

<p>
    ye magazines aur newspaper style design me use hota hai.
</p>

</body>
</html>
