<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Padding Inline & Block</title>

<style>
    body{
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    .box{
        border: 2px solid #000;
        width: 300px;
        background: #f2f2f2;

        /* Logical padding */
        padding-inline: 40px;   /* left + right */
        padding-block: 20px;    /* top + bottom */
    }

    .box2{
        border: 2px solid blue;
        width: 300px;
        background: #dff9fb;
        margin-top: 30px;

        /* Different values */
        padding-inline: 10px 40px;  /* start end */
        padding-block: 5px 25px;    /* top bottom */
    }
</style>
</h
