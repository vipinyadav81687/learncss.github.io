<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Print Break Example</title>

<style>
    body{
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    .section{
        border: 2px solid #000;
        padding: 20px;
        margin-bottom: 20px;
    }

    /* ======================
       PRINT BREAK RULES
    ====================== */
    @media print{

        /* New page BEFORE this element */
        .break-before{
            break-before: page;
        }

        /* New page AFTER this element */
        .break-after{
            break-after: page;
        }

        /* Prevent page break INSIDE element */
        .no-break{
            break-inside: avoid;
        }

    }
</style>
</head>

<body>

<h1>CSS Page Break Demo</h1>

<div class="section">
    <p>Section 1 – Normal content</p>
</div>

<div class="section break-before">
    <p>Section 2 – New page starts BEFORE this section</p>
</div>

<div class="section break-after">
    <p>Section 3 – New page AFTER this section</p>
</div>

<div class="section no-break">
    <p>
        Section 4 – Is box ke andar page break nahi hoga.  
        Ye table, invoice ya card ke liye useful hai.
    </p>
</div>

<button onclick="window.print()">Print</button>

</body>
</html>
