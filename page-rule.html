<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS @page Rule</title>

<style>
    body{
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    h1{
        text-align: center;
    }

    .box{
        border: 2px solid #000;
        padding: 20px;
        margin-bottom: 20px;
    }

    /* =====================
       PAGE RULE (PRINT)
    ====================== */
    @page{
        size: A4;                 /* A4 page */
        margin: 20mm;             /* page margin */
    }

    /* First page only */
    @page :first{
        margin-top: 40mm;
    }

    /* Print media */
    @media print{
        body{
            padding: 0;
        }

        .no-print{
            display: none;
        }
    }
</style>
</head>

<body>

<h1>CSS @page Example</h1>

<div class="box">
    <p>
        Ye content print page ke andar aayega.
        Margin aur page size @page rule se control hota hai.
    </p>
</div>

<button class="no-print" onclick="window.print()">Print</button>

</body>
</html>
