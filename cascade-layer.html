<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Cascade Layers</title>

<style>
/* =========================
   DEFINE LAYERS ORDER
========================= */
@layer reset, base, components, utilities;

/* =========================
   RESET LAYER
========================= */
@layer reset{
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
}

/* =========================
   BASE LAYER
========================= */
@layer base{
    body{
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    h1{
        color: darkblue;
    }
}

/* =========================
   COMPONENT LAYER
========================= */
@layer components{
    .card{
        border: 2px solid #000;
        padding: 15px;
        background: #f2f2f2;
        color: green;
    }
}

/* =========================
   UTILITIES LAYER
========================= */
@layer utilities{
    .text-red{
        color: red;
    }
}
</style>
</head>
<body>

<h1>CSS Cascade Layers</h1>

<div class="card text-red">
    Ye text red dikhega kyunki utilities layer sabse last hai.
</div>

</body>
</html>
