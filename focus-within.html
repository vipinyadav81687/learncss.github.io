<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>:focus-within</title>

    <style>
        *{
            box-sizing: border-box;
        }

        body{
            font-family: Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.4;
            padding: 20px 10%;
            background: #3c889b;
        }

        form{
            background: #fff;
            max-width: 600px;
            margin: auto;
            border-radius: 6px;
            overflow: hidden;
        }

        form header{
            padding: 2rem;
            background: #f5f5f5;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        form section{
            padding: 2rem;
        }

        .field{
            margin-bottom: 20px;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 4px;
        }

        /* ⭐ focus-within magic */
        .field:focus-within{
            border-color: #3c889b;
            background: #eaf6f9;
        }

        label{
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        select{
            width: 100%;
            padding: 8px;
            font-size: 14px;
        }

        .options label{
            font-weight: normal;
            display: block;
        }

        button{
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<form>
    <header>CSS :focus-within Pseudo Class</header>

    <section>

        <div class="field">
            <label>Full Name</label>
            <input type="text">
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email">
        </div>

        <div class="field options">
            <label>Gender</label>
            <label><input type="radio" name="g"> Male</label>
            <label><input type="radio" name="g"> Female</label>
        </div>

        <div class="field options">
            <label>Hobbies</label>
            <label><input type="checkbox"> Travel</label>
            <label><input type="checkbox"> Reading Books</label>
            <label><input type="checkbox"> Photography</label>
        </div>

        <div class="field">
            <label>Country</label>
            <select>
                <option>India</option>
                <option>USA</option>
                <option>UK</option>
            </select>
        </div>

        <button type="submit">Submit</button>

    </section>
</form>

</body>
</html>
