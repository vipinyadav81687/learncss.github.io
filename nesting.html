<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Nesting</title>

<style>
/* Parent */
.card{
    border: 2px solid #333;
    padding: 20px;
    width: 300px;
    font-family: Arial;

    /* Nested selector */
    h2{
        color: darkblue;
        margin-bottom: 10px;
    }

    p{
        color: #555;
        font-size: 14px;
    }

    /* Nested pseudo-class */
    &:hover{
        background: #f0f0f0;
    }

    /* Nested child */
    button{
        background: steelblue;
        color: white;
        border: none;
        padding: 8px 12px;
        cursor: pointer;

        &:hover{
            background: darkblue;
        }
    }
}
</style>
</head>

<body>

<div class="card">
    <h2>CSS Nesting</h2>
    <p>Ye example pure CSS nesting ka hai.</p>
    <button>Click Me</button>
</div>

</body>
</html>
