<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File Selector Button</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    padding: 40px;
}

/* label text */
label{
    font-size: 18px;
    margin-right: 10px;
}

/* remove default file input look */
input[type="file"]{
    font-size: 16px;
}

/* file selector button (Chrome / Edge) */
input[type="file"]::file-selector-button{
    background-color: #a28bff;
    border: 1px solid #6c5ce7;
    color: #000;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 10px;
}

/* hover effect */
input[type="file"]::file-selector-button:hover{
    background-color: #8e79ff;
}

/* Safari / old Chrome support */
input[type="file"]::-webkit-file-upload-button{
    background-color: #a28bff;
    border: 1px solid #6c5ce7;
    color: #000;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<form>
    <label>Upload File</label>
    <input type="file">
</form>

</body>
</html>
