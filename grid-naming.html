<html>
<head>
    <meta charset="UTF-8">
    <title>CSS Grid</title>
 
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            padding: 0 0 0 40px;
        }

        .container{
            background: #eee;
            width: 700px;
            margin: 50px auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: [header-start]120px[header-end] 60px 100px 400px;
            grid-gap: 15px;

        }

        .header{
            background: orangered; 
         grid-row: header-start / header-end;
         grid-column: 1 /-1;
         
        }

        .menu{ 
            background: yellowgreen;
             grid-row: 2 / 3;
         grid-column: 1 /-1;
        }

        .items3{
            background: slateblue;
           
        }

        .items4{
            background: hotpink;
         
        }

        .sidebar{
            background: royalblue;
       grid-row: 3/ 5;
        }

        .content{
            background: goldenrod;
           grid-row: 4 /5;
           grid-column: 1/3;
        }
    </style>
</head>

<body>

    <h1> vipin yadav: CSS Grid-Gap</h1>

    <div class="container">
        <div class="header">First</div>
        <div class="menu">Second</div>
        <div class="items3">Third</div>
        <div class="items4">Fourth</div>
        <div class="sidebar">Fifth</div>
        <div class="content">Sixth</div>
    </div>

</body>
</html>
