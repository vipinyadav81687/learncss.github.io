<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Backdrop Filter Blur</title>

<style>
body{
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #222;
}

/* OUTER CONTAINER */
#container{
    width: 600px;
    height: 600px;
    border: 5px solid #000;
    background: url("two/.jpg") no-repeat center;
    background-size: cover;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* INNER GLASS BOX */
#inner{
    width: 400px;
    height: 250px;
    border-radius: 5px;
    border: 2px solid #fff;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    background: rgba(255, 255, 255, 0.15);
}
</style>

</head>
<body>

<div id="container">
    <div id="inner"></div>
</div>

</body>
</html>
