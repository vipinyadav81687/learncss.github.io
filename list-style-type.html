<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>list-style-type</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            font-size: 20px;
            line-height: 24px;
        }

        h1{
            text-align: center;
            margin-bottom: 50px;
        }

        ul{
            list-style-type: ":: ";
            list-style-position: inside;
            line-height: 35px;
        }
    </style>
</head>
<body>

    <h1>list-style-type (string)</h1>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>PHP</li>
        <li>MySQL</li>
    </ul>

</body>
</html>
