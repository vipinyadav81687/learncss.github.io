<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Orientation</title>

  <style>
    #parent {
      display: flex;
      border: 1px solid #000;
    }

    #parent > div {
      border: 1px solid #000;
      padding: 20px;
      flex: 1;
      text-align: center;
    }

    /* Landscape mode */
    @media (orientation: landscape) {
      body {
        background: pink;
      }
    }

    /* Portrait mode */
    @media (orientation: portrait) {
      body {
        background: lightblue;
      }
    }
  </style>
</head>

<body>

  <h2>Rotate your device</h2>

  <div id="parent">
    <div>Box 1</div>
    <div>Box 2</div>
    <div>Box 3</div>
  </div>

</body>
</html>
